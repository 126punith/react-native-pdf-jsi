# Encrypted document: no password reports passwordRequired, the right one opens it.
appId: ${APP_ID}
---
- launchApp:
    stopApp: true
- extendedWaitUntil:
    visible: "load pages=5 outline=3"
    timeout: 20000
- extendedWaitUntil:
    notVisible: "Refreshing..."
    timeout: 20000
- tapOn:
    id: "open-locked"
- extendedWaitUntil:
    visible: "password required"
    timeout: 10000
- tapOn:
    id: "open-unlocked"
- extendedWaitUntil:
    visible: "load pages=2 outline=0"
    timeout: 10000
- extendedWaitUntil:
    visible: "thumbnails rendered 2"
    timeout: 10000
