description = 'react-native-pdf'

buildscript {
    ext.safeExtGet = { prop, fallback ->
        rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
    }
    repositories {
        mavenCentral()
        google()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.2.2")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${safeExtGet('kotlinVersion', '2.1.20')}")
    }
}

repositories {
    mavenCentral()
    google()
}

apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

def resolveReactNativeDirectory() {
    def reactNativeLocation = safeExtGet("REACT_NATIVE_NODE_MODULES_DIR", null)
    if (reactNativeLocation != null) {
        return file(reactNativeLocation)
    }

    // monorepo workaround
    // react-native can be hoisted or in project's own node_modules
    def reactNativeFromProjectNodeModules = file("${rootProject.projectDir}/../node_modules/react-native")
    if (reactNativeFromProjectNodeModules.exists()) {
        return reactNativeFromProjectNodeModules
    }

    def reactNativeFromNodeModulesWithPDF = file("${projectDir}/../../react-native")
    if (reactNativeFromNodeModulesWithPDF.exists()) {
        return reactNativeFromNodeModulesWithPDF
    }

    throw new Exception(
        "[react-native-pdf] Unable to resolve react-native location in " +
            "node_modules. You should add project extension property (in app/build.gradle) " +
            "`REACT_NATIVE_NODE_MODULES_DIR` with path to react-native."
    )
}

def getReactNativeMinorVersion() {
    def REACT_NATIVE_DIR = resolveReactNativeDirectory()

    def reactProperties = new Properties()
    file("$REACT_NATIVE_DIR/ReactAndroid/gradle.properties").withInputStream { reactProperties.load(it) }

    def REACT_NATIVE_VERSION = reactProperties.getProperty("VERSION_NAME")
    def REACT_NATIVE_MINOR_VERSION = REACT_NATIVE_VERSION.startsWith("0.0.0-") ? 1000 : REACT_NATIVE_VERSION.split("\\.")[1].toInteger()

    return REACT_NATIVE_MINOR_VERSION
}

// Optional on-device OCR (ML Kit). Enable via:
//   pdfJsiEnableOcr=true in gradle.properties
// or Expo config plugin: ["react-native-pdf-jsi", { "ocr": true }]
def isOcrEnabled() {
    def fromProject = project.findProperty("pdfJsiEnableOcr")
    def fromRoot = rootProject.findProperty("pdfJsiEnableOcr")
    def value = fromProject != null ? fromProject : fromRoot
    return value != null && value.toString().toBoolean()
}

apply plugin: "com.facebook.react"
apply from: '../nitrogen/generated/android/NitroPdfJsi+autolinking.gradle'

def reactNativeArchitectures() {
    def value = project.getProperties().get("reactNativeArchitectures")
    return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

// Prebuilt PDFium (libpdfn.so) is not shipped in the npm package. It is
// resolved in this order:
//   1. pdfJsiPdfiumDir gradle property (dir containing lib/<abi>/libpdfn.so)
//   2. third_party/pdfium/lib in this module (git checkout)
//   3. downloaded from pdfiumUrl (override with pdfJsiPdfiumUrl), checked
//      against pdfiumSha256 and cached in the Gradle user home
// Bump all three constants together; see scripts/package-pdfium.sh.
def pdfiumVersion = "r1"
def pdfiumSha256 = "330913954b8bf09f246fb907aecbc282e164e68c8dd647aab48718a679d19903"
def pdfiumDefaultUrl = "https://github.com/126punith/react-native-pdf-jsi/releases/download/pdfium-android-${pdfiumVersion}/pdfium-android-${pdfiumVersion}.zip"

def findPdfJsiProperty(String name) {
    def value = project.findProperty(name)
    return value != null ? value : rootProject.findProperty(name)
}

def hasPdfiumLibs(File libDir, abis) {
    return abis.every { new File(libDir, "${it}/libpdfn.so").isFile() }
}

def pdfiumAbis = reactNativeArchitectures()
def pdfiumOverride = findPdfJsiProperty("pdfJsiPdfiumDir")
def pdfiumBundledLib = file("third_party/pdfium/lib")
def pdfiumDownloadRoot = layout.buildDirectory.dir("pdfium/${pdfiumVersion}").get().asFile
def pdfiumNeedsDownload = false
def pdfiumLibDir

if (pdfiumOverride != null) {
    pdfiumLibDir = new File(rootProject.file(pdfiumOverride.toString()), "lib")
    if (!hasPdfiumLibs(pdfiumLibDir, pdfiumAbis)) {
        throw new GradleException(
            "[react-native-pdf-jsi] pdfJsiPdfiumDir=${pdfiumOverride} must contain " +
                "lib/<abi>/libpdfn.so for ${pdfiumAbis.join(', ')}."
        )
    }
} else if (hasPdfiumLibs(pdfiumBundledLib, pdfiumAbis)) {
    pdfiumLibDir = pdfiumBundledLib
} else {
    pdfiumLibDir = new File(pdfiumDownloadRoot, "lib")
    pdfiumNeedsDownload = true
}

def downloadPdfium = tasks.register("downloadPdfium") {
    description = "Downloads the prebuilt PDFium libraries used by react-native-pdf-jsi."
    onlyIf { pdfiumNeedsDownload }

    def url = (findPdfJsiProperty("pdfJsiPdfiumUrl") ?: pdfiumDefaultUrl).toString()
    def cacheZip = new File(
        gradle.gradleUserHomeDir,
        "caches/react-native-pdf-jsi/pdfium/${pdfiumVersion}/pdfium-android-${pdfiumVersion}.zip"
    )
    def abis = pdfiumAbis
    def outRoot = pdfiumDownloadRoot
    def libDir = pdfiumLibDir
    def expectedSha = pdfiumSha256

    inputs.property("url", url)
    inputs.property("sha256", expectedSha)
    outputs.dir(outRoot)

    doLast {
        def sha256 = { File f ->
            def digest = java.security.MessageDigest.getInstance("SHA-256")
            f.withInputStream { is ->
                byte[] buf = new byte[65536]
                int n
                while ((n = is.read(buf)) > 0) {
                    digest.update(buf, 0, n)
                }
            }
            return digest.digest().encodeHex().toString()
        }

        if (!cacheZip.isFile() || sha256(cacheZip) != expectedSha) {
            cacheZip.parentFile.mkdirs()
            def tmp = new File(cacheZip.parentFile, "${cacheZip.name}.part")
            logger.lifecycle("[react-native-pdf-jsi] Downloading PDFium ${pdfiumVersion} from ${url}")
            try {
                def conn = new URL(url).openConnection()
                conn.connectTimeout = 30000
                conn.readTimeout = 120000
                if (conn instanceof HttpURLConnection) {
                    conn.instanceFollowRedirects = true
                }
                conn.inputStream.withStream { is -> tmp.withOutputStream { os -> os << is } }
            } catch (Exception e) {
                tmp.delete()
                throw new GradleException(
                    "[react-native-pdf-jsi] Could not download PDFium from ${url} (${e.message}). " +
                        "For offline builds, set pdfJsiPdfiumDir in gradle.properties to a directory " +
                        "containing lib/<abi>/libpdfn.so, or pdfJsiPdfiumUrl to a mirror.",
                    e
                )
            }
            def actualSha = sha256(tmp)
            if (actualSha != expectedSha) {
                tmp.delete()
                throw new GradleException(
                    "[react-native-pdf-jsi] PDFium checksum mismatch for ${url}: " +
                        "expected ${expectedSha}, got ${actualSha}."
                )
            }
            cacheZip.delete()
            if (!tmp.renameTo(cacheZip)) {
                throw new GradleException("[react-native-pdf-jsi] Could not move ${tmp} to ${cacheZip}.")
            }
        }

        project.delete(outRoot)
        project.copy {
            from project.zipTree(cacheZip)
            into outRoot
        }
        if (!hasPdfiumLibs(libDir, abis)) {
            throw new GradleException(
                "[react-native-pdf-jsi] ${cacheZip} does not contain lib/<abi>/libpdfn.so for ${abis.join(', ')}."
            )
        }
    }
}

android {
    def agpVersion = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION
    if (agpVersion.tokenize('.')[0].toInteger() >= 7) {
        namespace "org.wonday.pdf"
    }
    compileSdkVersion safeExtGet('compileSdkVersion', 35)
    
    // Match the host app NDK so libc++_shared exports the same symbols.
    // 16KB alignment is set with -Wl,-z,max-page-size=16384 in CMake.
    ndkVersion safeExtGet("ndkVersion", "27.1.12297006")

    buildFeatures {
        buildConfig true
        prefab true
    }

    defaultConfig {
        minSdkVersion safeExtGet('minSdkVersion', 21)
        targetSdkVersion safeExtGet('targetSdkVersion', 35)
        buildConfigField("boolean", "IS_NEW_ARCHITECTURE_ENABLED", "true")
        buildConfigField("boolean", "PDF_JSI_OCR_ENABLED", isOcrEnabled().toString())
        
        // 🚀 JSI Configuration with 16KB Page Support
        ndk {
            abiFilters (*reactNativeArchitectures())
        }
        
        externalNativeBuild {
            cmake {
                cppFlags "-fexceptions", "-frtti", "-O3", "-ffast-math", "-funroll-loops"
                arguments "-DANDROID_STL=c++_shared",
                    "-DANDROID_PAGE_SIZE_AGNOSTIC=ON",
                    "-DPDFIUM_LIB_DIR=${pdfiumLibDir.absolutePath}"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            externalNativeBuild {
                cmake {
                    cppFlags "-DNDEBUG", "-O3", "-ffast-math", "-funroll-loops"
                }
            }
        }
        debug {
            debuggable true
            jniDebuggable true
            
            externalNativeBuild {
                cmake {
                    cppFlags "-DDEBUG", "-O0", "-g"
                }
            }
        }
    }
    
    // 🚀 JSI Native Build Configuration
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            version "3.22.1"
        }
    }

    sourceSets.main {
        java {
            srcDirs += ["src/main/java"]
        }
    }

    lintOptions {
        abortOnError true
    }

    packagingOptions {
        pickFirst 'lib/x86/libc++_shared.so'
        pickFirst 'lib/x86_64/libjsc.so'
        pickFirst 'lib/x86_64/libc++_shared.so'
        pickFirst 'lib/arm64-v8a/libjsc.so'
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
        // 🚀 JSI Native Libraries
        pickFirst '**/libc++_shared.so'
        pickFirst '**/libjsc.so'
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'com.facebook.react:react-native:+'
    implementation 'androidx.annotation:annotation:1.7.0'
    implementation 'androidx.core:core:1.12.0'

    // Optional on-device OCR (only when pdfJsiEnableOcr=true)
    if (isOcrEnabled()) {
        implementation 'com.google.mlkit:text-recognition:16.0.1'
    }

    implementation project(":react-native-nitro-modules")

    testImplementation 'junit:junit:4.13.2'
}

tasks.configureEach { task ->
        if (task.name.contains("configureCMake") || task.name.contains("buildCMake")
                || task.name.startsWith("externalNativeBuildClean")) {
            task.dependsOn(":react-native-nitro-modules:prepareHeaders")
        }
        if (task.name.contains("configureCMake") || task.name.contains("buildCMake")) {
            task.dependsOn(downloadPdfium)
        }
    }

    // Nitro's clean deletes android/build/headers/nitromodules, then this
    // module's ninja clean reconfigures CMake and rejects the missing prefab
    // include path. Recreate the headers after that clean.
    gradle.projectsEvaluated {
        def nitroProject = rootProject.findProject(":react-native-nitro-modules")
        if (nitroProject == null) {
            return
        }
        nitroProject.tasks.named("prepareHeaders").configure {
            mustRunAfter(nitroProject.tasks.named("clean"))
        }
    }